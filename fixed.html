<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faste påminnelser - Husk</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="app-auth-pending">
  <nav class="navbar navbar-expand-sm navbar-dark app-nav app-nav-compact">
    <div class="container">
      <a class="navbar-brand" href="dashboard.html">Husk</a>
      <div class="app-nav-links navbar-nav ms-auto align-items-sm-center gap-sm-2">
        <a class="nav-link" href="dashboard.html">Ny</a>
        <a class="nav-link active" href="fixed.html">Faste</a>
        <a class="nav-link" href="write.html">Skriv</a>
        <span id="user-label" class="nav-user small"></span>
        <button id="logout-btn" class="btn btn-outline-light btn-sm" type="button">Logg ut</button>
      </div>
    </div>
  </nav>

  <main class="container py-3 entries-page">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <section class="card form-card">
          <div class="card-body p-4">
            <div class="mb-4">
              <h1 class="h4 mb-0">Ny fast påminnelse</h1>
            </div>

            <div id="status-msg" class="alert d-none" role="alert"></div>

            <form id="fixed-form" novalidate>
              <label class="form-label" for="fixed-text">Tekst</label>
              <textarea
                id="fixed-text"
                class="form-control form-control-lg"
                rows="3"
                maxlength="1500"
                placeholder="Skriv her"
                required
              ></textarea>

              <div class="mt-3">
                <label class="form-label" for="fixed-category">Kategori</label>
                <select id="fixed-category" class="form-select">
                  <option value="unknown" selected>Ukjent</option>
                  <option value="work">Jobb</option>
                  <option value="creative">Kreativt</option>
                  <option value="houseproj">Houseproj</option>
                  <option value="family">Familie</option>
                  <option value="general">Generelt</option>
                  <option value="huskmcp">Husk MCP</option>
                </select>
              </div>

              <div class="mt-3">
                <label class="form-label" for="recurrence-type">Gjentagelse</label>
                <select id="recurrence-type" class="form-select">
                  <option value="none" selected>Ingen (engangspåminnelse)</option>
                  <option value="daily">Daglig</option>
                  <option value="weekly">Ukentlig</option>
                  <option value="monthly">Månedlig</option>
                  <option value="yearly">Årlig</option>
                </select>
              </div>

              <div id="weekly-options" class="mt-3 d-none">
                <label class="form-label">Dager</label>
                <div class="d-flex flex-wrap gap-2">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="day-1" value="1">
                    <label class="form-check-label" for="day-1">Man</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="day-2" value="2">
                    <label class="form-check-label" for="day-2">Tir</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="day-3" value="3">
                    <label class="form-check-label" for="day-3">Ons</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="day-4" value="4">
                    <label class="form-check-label" for="day-4">Tor</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="day-5" value="5">
                    <label class="form-check-label" for="day-5">Fre</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="day-6" value="6">
                    <label class="form-check-label" for="day-6">Lør</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="day-0" value="0">
                    <label class="form-check-label" for="day-0">Søn</label>
                  </div>
                </div>
              </div>

              <div id="monthly-options" class="mt-3 d-none">
                <label class="form-label" for="day-of-month">Dag i måneden (1-31)</label>
                <input type="number" id="day-of-month" class="form-control" min="1" max="31" placeholder="1">
              </div>

              <div id="yearly-options" class="mt-3 d-none">
                <label class="form-label" for="yearly-date">Dato (MM-DD)</label>
                <input type="text" id="yearly-date" class="form-control" placeholder="05-17" pattern="\d{2}-\d{2}">
                <small class="form-text text-muted">Format: MM-DD (f.eks. 05-17 for 17. mai)</small>
              </div>

              <div class="d-flex justify-content-end align-items-center mt-4 gap-3 flex-wrap">
                <button id="submit-btn" class="btn btn-dark" type="submit">Lagre</button>
              </div>
            </form>
          </div>
        </section>

        <section id="fixed-section" class="mt-3 d-none">
          <p class="eyebrow mb-2" style="font-size:0.72rem">Faste påminnelser</p>
          <div id="fixed-list" class="entries-list"></div>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="./js/fixed.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Husk</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#1d1d1b" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="app-auth-pending">
  <nav class="navbar navbar-expand-sm navbar-dark app-nav app-nav-compact">
    <div class="container">
      <a class="navbar-brand brand-lockup" href="dashboard.html" aria-label="Husk"><img src="brand-mark.svg" alt="" class="brand-h" aria-hidden="true" /><span class="brand-usk">usk</span></a>
      <div class="app-nav-links navbar-nav ms-auto align-items-sm-center gap-sm-2">
        <a class="nav-link active" href="dashboard.html">Ny</a>
        <a class="nav-link" href="fixed.html">Faste</a>
        <a class="nav-link" href="write.html">Skriv</a>
        <a class="nav-link" href="audio.html">Lyd</a>
        <a class="nav-link" href="axioms.html">Axioms</a>
        <span id="user-label" class="nav-user small"></span>
        <button id="logout-btn" class="btn btn-outline-light btn-sm" type="button">Logg ut</button>
      </div>
    </div>
  </nav>

  <main class="container py-3 entries-page">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <section class="card form-card">
          <div class="card-body p-4">
            <div id="status-msg" class="alert d-none" role="alert"></div>

            <form id="entry-form" class="entry-form-compact" novalidate>
              <textarea
                id="entry-text"
                class="form-control form-control-lg"
                rows="1"
                maxlength="1500"
                placeholder="Skriv her"
                required
              ></textarea>

              <div class="mt-3 form-extra-controls">
                <select id="entry-category" class="category-select-ghost">
                  <option value="general" selected>Generelt</option>
                  <option value="work">Jobb</option>
                  <option value="creative">Kreativt</option>
                  <option value="houseproj">Houseproj</option>
                  <option value="family">Familie</option>
                  <option value="huskmcp">Husk MCP</option>
                  <option value="axiom">Aksiomat</option>
                </select>
              </div>

              <div class="d-flex justify-content-end align-items-center mt-4 gap-3 flex-wrap form-extra-controls">
                <button id="submit-btn" class="btn btn-dark" type="submit">Lagre</button>
              </div>
            </form>
          </div>
        </section>

        <section id="recent-section" class="mt-3 d-none">
          <div id="recent-filter-tabs" class="folder-tabs mb-3" role="tablist" aria-label="Filtrer notater">
            <button class="folder-tab active" type="button" data-filter-tab="general" aria-pressed="true">Generelt</button>
            <button class="folder-tab" type="button" data-filter-tab="work" aria-pressed="false">Jobb</button>
            <button class="folder-tab" type="button" data-filter-tab="calendar" aria-pressed="false">Kalender</button>
            <button class="folder-tab" type="button" data-filter-tab="audio" aria-pressed="false">Lyd</button>
            <button class="folder-tab" type="button" data-filter-tab="write" aria-pressed="false">Skriv</button>
            <button class="folder-tab folder-tab-later" type="button" data-filter-tab="later" aria-pressed="false">Senere</button>
          </div>
          <div id="recent-list" class="recent-list"></div>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="./js/dashboard.js"></script>
</body>
</html>

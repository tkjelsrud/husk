<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skriv - Husk</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#1d1d1b" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown-light.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body class="app-auth-pending write-page">
  <nav class="navbar navbar-expand-sm navbar-dark app-nav app-nav-compact">
    <div class="container-fluid">
      <a class="navbar-brand brand-lockup" href="dashboard.html" aria-label="Husk"><img src="brand-mark.svg" alt="" class="brand-h" aria-hidden="true" /><span class="brand-usk">usk</span></a>
      <div class="app-nav-links navbar-nav ms-auto align-items-sm-center gap-sm-2">
        <a class="nav-link" href="dashboard.html">Ny</a>
        <a class="nav-link" href="fixed.html">Faste</a>
        <a class="nav-link active" href="write.html">Skriv</a>
        <a class="nav-link" href="audio.html">Lyd</a>
        <span id="user-label" class="nav-user small"></span>
        <button id="logout-btn" class="btn btn-outline-light btn-sm" type="button">Logg ut</button>
      </div>
    </div>
  </nav>

  <div class="write-shell">
    <aside class="write-sidebar">
      <div class="write-sidebar-header">
        <button id="new-btn" class="btn btn-dark btn-sm w-100" type="button">+ Nytt dokument</button>
      </div>
      <ul id="doc-list" class="write-doc-list"></ul>
    </aside>

    <div id="view-panel" class="write-panel">
      <button id="back-btn" class="btn btn-link write-back-btn d-none" type="button">← Tilbake</button>

      <div id="empty-state" class="write-empty-state">
        <p class="text-muted">Velg et dokument eller opprett et nytt.</p>
      </div>

      <div id="view-mode" class="d-none">
        <div class="write-view-header">
          <h1 id="view-title" class="write-view-title"></h1>
          <div class="write-view-actions">
            <button id="edit-btn" class="btn btn-outline-secondary btn-sm" type="button">Rediger</button>
            <button id="archive-btn" class="btn btn-link write-archive-btn" type="button">Arkiver</button>
            <button id="delete-btn" class="btn btn-link write-delete-btn" type="button">Slett</button>
          </div>
        </div>
        <div id="view-body" class="markdown-body write-view-body"></div>
      </div>

      <div id="edit-mode" class="d-none">
        <div class="write-edit-form">
          <div id="draft-recovery" class="write-draft-recovery d-none" role="status" aria-live="polite">
            <div>
              <strong>Lokal kladd funnet.</strong>
              <span id="draft-recovery-text" class="text-muted small d-block"></span>
            </div>
            <div class="write-draft-actions">
              <button id="use-draft-btn" class="btn btn-outline-secondary btn-sm" type="button">Fortsett lokal versjon</button>
              <button id="discard-draft-btn" class="btn btn-link btn-sm" type="button">Forkast</button>
            </div>
          </div>
          <input id="edit-title" class="form-control write-title-input" type="text"
                 placeholder="Tittel" maxlength="200" />
          <textarea id="edit-content" class="form-control write-content-input"
                    placeholder="Skriv markdown her..." spellcheck="false"></textarea>
          <div class="write-edit-footer">
            <button id="cancel-edit-btn" class="btn btn-link" type="button">Avbryt</button>
            <button id="save-btn" class="btn btn-dark" type="button">Lagre</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="write-toast-container" class="write-toast-container" aria-live="polite"></div>

  <script>
    marked.setOptions({ gfm: true, breaks: true });
  </script>
  <script type="module" src="./js/write.js"></script>
</body>
</html>
